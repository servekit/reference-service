# Generated by golang-service-docker. Edit the skill inputs and rerender
# instead of hand-merging dependency files.

services:
  reference-service:
    image: ${IMAGE_REPOSITORY:-reference-service}:${IMAGE_TAG:-latest}
    build:
      context: ".."
      dockerfile: "reference-service/Dockerfile"
      # Override GOPROXY in .env (e.g. GOPROXY=https://goproxy.cn,direct) when
      # proxy.golang.org is unreachable from the build host.
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      - REFERENCE_SERVICE_SERVER_GRPC_ADDR=${REFERENCE_SERVICE_SERVER_GRPC_ADDR:-:19094}
      - REFERENCE_SERVICE_LOG_LEVEL=${REFERENCE_SERVICE_LOG_LEVEL:-info}
      - REFERENCE_SERVICE_CRON_TIMEZONE=${REFERENCE_SERVICE_CRON_TIMEZONE:-Asia/Shanghai}
      - REFERENCE_SERVICE_LOG_FORMAT=${REFERENCE_SERVICE_LOG_FORMAT:-json}
      - VAR=${VAR:-}
    ports:
      - "${HOST_GRPC_PORT:-19094}:19094"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:19094", "-connect-timeout=2s"]
      interval: ${HEALTHCHECK_INTERVAL:-10s}
      timeout: ${HEALTHCHECK_TIMEOUT:-3s}
      retries: ${HEALTHCHECK_RETRIES:-6}
      start_period: ${HEALTHCHECK_START_PERIOD:-10s}




